<html lang="pt-BR">
<head>

<title>Materiais · English with Dan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,400;0,600;1,400&family=Jost:wght@400;500;600&family=Inter:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2B2A24; --muted:#5F5B4F; --paper:#FDFCF9; --soft:#FAF9F4; --white:#FFFFFF; --line:#E5E1D6;
  --terra:#C15A2E; --terra-deep:#9C4720; --terra-tint:#FBE8DC; --success:#1F8A63;
  --radius:14px; color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;letter-spacing:.01em;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--terra);outline-offset:2px;border-radius:6px}
header{padding:26px 20px;border-bottom:3px solid var(--ink)}
.inner{max-width:760px;margin:0 auto}
.logo{display:inline-block;background:#fff;margin:0 0 16px -5px;padding:4px 6px 2px}
.logo img{display:block;height:120px;width:auto}
@media(max-width:480px){.logo img{height:84px}}
.eyebrow{font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--terra-deep);margin:0 0 6px;font-weight:600}
h1{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:clamp(28px,5.4vw,42px);line-height:1.15;margin:0 0 8px}
.tagline{font-family:'Josefin Sans',sans-serif;font-style:italic;font-size:17px;color:var(--muted);margin:0}
main{max-width:760px;margin:0 auto;padding:22px 20px 60px}
.search{width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--white);padding:12px 14px;font-size:16px;outline:none;margin-bottom:8px}
.search:focus{border-color:var(--terra)}
section{margin-top:26px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.badge{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--paper);background:var(--ink);border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;transform:rotate(-3deg);flex-shrink:0}
h2{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:24px;margin:0;line-height:1.2}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-left:auto}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--white);border:1.5px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.item:hover{border-color:#D6D1C4}
.info{flex:1 1 260px;min-width:0}
.tag{display:inline-block;font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-deep);background:var(--terra-tint);border-radius:999px;padding:2px 10px;margin-bottom:4px}
.title{font-family:'Josefin Sans',sans-serif;font-weight:600;font-size:19px;line-height:1.25}
.desc{font-size:14px;color:var(--muted);margin-top:2px}
.url{display:block;margin-top:6px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--terra-deep);word-break:break-all;text-decoration:none;user-select:all}
.url:hover{text-decoration:underline}
.actions{display:flex;gap:8px;align-items:center}
.open{font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;background:var(--terra);color:#fff;border-radius:24px;padding:10px 20px}
.open:hover{background:var(--terra-deep)}
.copy{font-family:'Jost',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:var(--white);color:var(--ink);border:1.5px solid var(--ink);border-radius:24px;padding:9px 16px}
.copy:hover{background:var(--ink);color:var(--paper)}
.copy.ok{border-color:var(--success);background:var(--success);color:#fff}
.empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:16px 18px;color:var(--muted);font-size:14px;background:var(--soft)}
footer{max-width:760px;margin:0 auto;padding:0 20px 50px;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>

  <p class="tagline">Tudo num lugar só. Abra ou copie o link para mandar aos alunos.</p>

<main>
  <input class="search" id="q" type="search" placeholder="Buscar por aula, tema ou aluno…" aria-label="Buscar materiais">
  <div id="sections"></div>
</main>

<footer>English with Dan</footer>

<script>
/* ============================================================
   LISTA DE MATERIAIS
   Para adicionar um novo: copie uma linha inteira { ... },
   cole logo abaixo e troque o tipo, o título, a descrição e o link.
   tipo: "planner", "worksheet" ou "missao"
   ============================================================ */
const MATERIAIS = [
  { tipo:"planner",   titulo:"Places in Town · Plano da semana", descricao:"Casal iniciante · revisões 24h / 2 dias / véspera, com a trilha da montanha", link:"places-in-town.html" },
  { tipo:"worksheet", titulo:"Places in Town", descricao:"Vocabulário de lugares da cidade e Where can I…?", link:"https://roleplay-tutor.onrender.com/static/places-in-town-ewd.html" },
  { tipo:"missao",    titulo:"Clothes · Mini-missão", descricao:"Alexandre e Paula · 3 tarefas (24h / 2 dias / véspera), resposta para a Dandara", link:"mini-missao-clothes.html" },
  { tipo:"missao",    titulo:"Present Continuous · Mini-missão", descricao:"Alexandre e Paula · 3 tarefas (24h / 2 dias / véspera), áudio: o que está acontecendo agora?", link:"mini-missao-present-continuous.html" },
  { tipo:"missao",    titulo:"My routine this week · Mini-missão", descricao:"Alexandre e Paula · rotina (usually) × esta semana (I'm …ing), 24h / 2 dias / véspera", link:"mini-missao-routine-this-week.html" },
  { tipo:"missao",    titulo:"What's happening today? · Mini-missão", descricao:"Alexandre e Paula · revisão do present continuous: consertar frases, câmera ao vivo, áudio da sua \"câmera\"", link:"mini-missao-whats-happening-today.html" },
];

const SECOES = [
  { tipo:"planner",   nome:"Planners", vazio:"Nenhum planner ainda." },
  { tipo:"worksheet", nome:"Worksheets", vazio:"Nenhuma worksheet ainda." },
  { tipo:"missao",    nome:"Mini-missões", vazio:"Nenhuma mini-missão ainda." }
];

const SITE = 'https://ewd-planners.onrender.com/';
function fullLink(l){ try{ return new URL(l, SITE).href; }catch(e){ return l; } }
function esc(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const box = document.getElementById('sections'); box.innerHTML='';
  SECOES.forEach((s,i)=>{
    const items = MATERIAIS.filter(m=>m.tipo===s.tipo && (!q || (m.titulo+' '+m.descricao).toLowerCase().includes(q)));
    const sec = document.createElement('section');
    sec.innerHTML = `<div class="sec-head"><div class="badge">0${i+1}</div><h2>${s.nome}</h2><span class="count">${items.length}</span></div>`;
    const list = document.createElement('div'); list.className='list';
    if(!items.length) list.innerHTML = `<div class="empty">${q?'Nada encontrado nesta seção.':s.vazio}</div>`;
    items.forEach(m=>{
      const url = fullLink(m.link);
      const el = document.createElement('div'); el.className='item';
      el.innerHTML = `<div class="info"><span class="tag">${s.tipo==='planner'?'Planner':s.tipo==='missao'?'Mini-missão':'Worksheet'}</span><div class="title">${esc(m.titulo)}</div><div class="desc">${esc(m.descricao)}</div><a class="url" href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></div>
        <div class="actions"><a class="open" href="${esc(url)}" target="_blank" rel="noopener">Abrir</a><button class="copy" type="button">Copiar link</button></div>`;
      el.querySelector('.copy').onclick = async (ev)=>{
        const b = ev.currentTarget; let ok=false;
        try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){
          try{ const t=document.createElement('textarea'); t.value=url; document.body.append(t); t.select(); ok=document.execCommand('copy'); t.remove(); }catch(e2){}
        }
        b.textContent = ok?'Copiado!':'Não deu'; b.classList.toggle('ok',ok);
        setTimeout(()=>{ b.textContent='Copiar link'; b.classList.remove('ok'); },2000);
      };
      list.append(el);
    });
    sec.append(list); box.append(sec);
  });
}
document.getElementById('q').addEventListener('input', render);
render();
</script>
