<!doctype html>
<!--
  MINI-MISSÃO · modelo independente (layout da página "Tarefa" do Result Planner)
  ---------------------------------------------------------------------------------
  Arquivo único, funciona sozinho (sem servidor). Para criar uma missão nova, troque só
  o objeto MISSION no <script> lá embaixo.

  Estrutura da página (de cima para baixo):
   1. Cabeçalho: logo + etiqueta ("Tarefa de hoje")
   2. Linha pequena: data · semana · duração
   3. Saudação grande: "Oi, Nome. Sua tarefa de hoje:"
   4. Cartão da tarefa: selo do tipo (Lembrar / Novo contexto / Passivo / Produção),
      título, botão grande do recurso (vídeo/áudio/link), instruções, duração
   5. "Minha resposta": caixa de texto que salva sozinha (neste modelo: no aparelho do aluno)
      — ou aviso de áudio, se a tarefa pede gravação (audio: true)
   6. "Chunks da semana" (abre/fecha)
   7. Botão "Feito ✓" + mensagem de parabéns + barra de progresso das tarefas

  Marcas: <html class="brand-dan"> = English with Dan (padrão). Tire a classe para as cores da Result
  (aí troque também o logo, que aqui está embutido em base64).
  Tipos de tarefa (type): "retrieval" (Lembrar), "contexto" (Novo contexto), "passivo" (Passivo), "producao" (Produção).
-->

<style>
/* Cores da Result */
:root{--ink:#1F2226;--orange:#EE8B22;--orange-dark:#B85F05;--peach:#FDE6CC;--peach-light:#FFF4E8;--warm-gray:#F3EEE8;--gray-mid:#DCD6CF;--border:#EFE3D6;
  --t2:#6B7079;--t3:#9A9EA5;--display:'Inter Tight','Helvetica Neue',Arial,sans-serif;--body:'Inter','Helvetica Neue',Arial,sans-serif;--title:var(--display)}
/* Cores do English with Dan */
html.brand-dan{--ink:#322E22;--orange:#C56A3E;--orange-dark:#9E4F2A;--peach:#F3DCCD;--peach-light:#FBF2EC;--warm-gray:#EFEAE3;--gray-mid:#DCD5CB;--border:#EDE4DA;
  --t2:#65635D;--t3:#97938B;--title:'Source Serif 4',Georgia,'Times New Roman',serif}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--body);color:var(--ink);background:#fff;line-height:1.5}
.head{border-bottom:3px solid var(--ink);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.head img{height:40px;width:auto;display:block}
.head span{font:700 10.5px var(--display);letter-spacing:.14em;text-transform:uppercase;background:var(--peach);border-radius:20px;padding:4px 11px}
main{max-width:520px;margin:0 auto;padding:22px 18px 48px;display:flex;flex-direction:column;gap:14px}
.eye{font:700 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--orange-dark)}
h1{font-family:var(--title);font-weight:900;font-size:clamp(24px,7vw,30px);letter-spacing:-.02em;line-height:1.15}
html.brand-dan h1,html.brand-dan .task h2{font-weight:700;letter-spacing:-.005em}
h1 span{color:var(--orange)}
.task{border:1px solid var(--border);border-top:4px solid var(--orange);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px}
.badge{align-self:flex-start;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px}
.b-retrieval{background:var(--orange);color:#fff}.b-contexto{background:var(--peach);color:var(--orange-dark)}
.b-producao{background:var(--orange-dark);color:#fff}.b-passivo{background:var(--warm-gray);color:var(--t2)}
.task h2{font-family:var(--title);font-size:19px;font-weight:800;line-height:1.3}
.det{font-size:15px;color:var(--t2);white-space:pre-line}
.dur{font-size:13px;color:var(--t3);font-weight:500}
details{border:1px dashed var(--gray-mid);border-radius:12px;padding:10px 12px;font-size:14.5px}
details summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 2px 18px;display:flex;flex-direction:column;gap:3px}
.done{font:800 18px var(--display);background:var(--orange);color:#fff;border:0;border-radius:16px;padding:17px;cursor:pointer;transition:transform .12s}
.done:active{transform:scale(.98)}
.done.ok{background:var(--ink)}
.done:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.cele{background:var(--peach-light);border-radius:12px;padding:12px;font-size:15px;text-align:center}
.prog{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--t2)}
.bar{height:9px;background:var(--warm-gray);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .6s}
.resource{display:block;text-align:center;background:var(--ink);color:#fff;font:800 16px var(--display);text-decoration:none;border-radius:12px;padding:13px 14px;word-break:break-word}
.resource:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.answer{display:flex;flex-direction:column;gap:6px}
.answer label{font:800 15px var(--display)}
.answer label small{font:500 12px var(--body);color:var(--t3)}
.answer textarea{font:16px var(--body);line-height:1.5;border:1.5px solid var(--gray-mid);border-radius:12px;padding:12px;resize:vertical;min-height:120px;color:var(--ink)}
.answer textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px var(--peach)}
.answer-hint{font-size:13.5px;background:var(--peach-light);border-radius:10px;padding:8px 10px}
.answer-saved{font-size:12.5px;color:var(--t3);min-height:16px}
.audio-note{font-size:15px;background:var(--peach-light);border:1px solid var(--peach);border-radius:12px;padding:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:700 13px var(--display);border:1.5px solid var(--gray-mid);background:#fff;color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button.ok::after{content:" ✓"}
.teacher{border:1px dashed var(--gray-mid);border-radius:12px;padding:10px 12px;margin-top:22px;font-size:14.5px}
.teacher summary{color:var(--t3);font-weight:600}
.tmsg{border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.tmsg b{font:800 14px var(--display)}
.tmsg textarea{font:14.5px var(--body);line-height:1.45;border:1.5px solid var(--gray-mid);border-radius:10px;padding:10px;min-height:150px;resize:vertical;color:var(--ink)}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wa{background:#1F8A63;color:#fff;text-decoration:none;font:800 14px var(--display);border-radius:10px;padding:10px 14px}
.cp{background:#fff;border:1.5px solid var(--ink);color:var(--ink);font:700 14px var(--display);border-radius:10px;padding:9px 14px;cursor:pointer}
.cpok{font-size:13px;color:#1F8A63}
@media (prefers-reduced-motion:reduce){.bar i,.done{transition:none}}
</style>
</head><body>

    $("det").textContent = d.det || ""; $("det").hidden = !d.det;
    $("dur").textContent = d.dur ? "Leva " + d.dur : "";
    if (d.link) {
      var h = host(d.link), video = /youtube|youtu\.be|vimeo|ted\.com|loom/i.test(h);
      $("resource").href = d.link; $("resource").hidden = false;
      $("resource").textContent = (video ? "▶ Abrir o vídeo" : /spotify|podcast|soundcloud/i.test(h) ? "🎧 Abrir o áudio" : "Abrir o link") + " · " + h + " ↗";
    } else $("resource").hidden = true;
    $("audioNote").hidden = !d.audio; $("answerBox").hidden = !!d.audio;
    $("answer").value = S.answers[cur] || ""; $("answerSaved").textContent = S.answers[cur] ? "Salvo ✓" : "";
    $("answerHint").hidden = d.type !== "retrieval";
    $("answerHint").textContent = "Escrevam de memória primeiro. Só depois abram os chunks da semana para conferir: o esforço de lembrar é o que fixa.";
    $("chunks").hidden = !MISSION.chunks.length; $("chunks").open = false;
    $("chunksSum").textContent = d.type === "retrieval" ? "Conferir os chunks (só depois de tentar!)" : "Chunks da semana";
    $("chunksList").innerHTML = MISSION.chunks.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("");
    paint(false);
  }
  function paint(just) {
    var n = Object.keys(S.done).length, total = MISSION.tasks.length, done = !!S.done[cur];
    $("done").textContent = done ? "Feito ✓  (toque para desmarcar)" : "Feito ✓";
    $("done").classList.toggle("ok", done); $("done").setAttribute("aria-pressed", done);
    $("cele").hidden = !done;
    $("cele").textContent = (just ? "Boa" + (name ? ", " + name : "") + "! " : "") + (n === total ? "Vocês fizeram todas as tarefas da semana! 🎉" : "Tarefa marcada.");
    $("progTxt").textContent = "Esta semana: " + n + " de " + total + " tarefas";
    $("bar").style.width = (n / total * 100) + "%";
    tabs();
  }
  $("answer").addEventListener("input", function () {
    clearTimeout(t); $("answerSaved").textContent = "Salvando…";
    t = setTimeout(function () { S.answers[cur] = $("answer").value; save(); $("answerSaved").textContent = "Salvo ✓"; }, 600);
  });
  $("done").addEventListener("click", function () {
    var now = !S.done[cur]; if (now) S.done[cur] = true; else delete S.done[cur];
    save(); paint(now);
  });
  var hm = /^#t(\d+)$/.exec(location.hash);
  if (hm && MISSION.tasks[+hm[1] - 1]) cur = +hm[1] - 1;
  window.addEventListener("hashchange", function () { var m = /^#t(\d+)$/.exec(location.hash); if (m && MISSION.tasks[+m[1] - 1]) { cur = +m[1] - 1; render(); window.scrollTo(0, 0); } });
  render();

  /* mensagens de WhatsApp para o professor */
  var base = location.origin + location.pathname;
  $("tmsgs").innerHTML = MISSION.tasks.map(function (d, i) {
    var msg = "Oi, " + name + "! 👋 A tarefa de hoje (" + d.day.toLowerCase() + ") · " + d.dur + ":\n*" + d.title + "*\n👉 " + base + "#t" + (i + 1) + "\nQuando terminarem, toquem em “Feito”.";
    return '<div class="tmsg"><b>' + esc(d.day) + " · " + esc(LABEL[d.type] || "") + '</b><textarea data-i="' + i + '">' + esc(msg) + '</textarea><div class="trow"><a class="wa" target="_blank" rel="noopener" href="#">Enviar no WhatsApp</a><button class="cp" type="button">Copiar</button><span class="cpok"></span></div></div>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".tmsg"), function (box) {
    var ta = box.querySelector("textarea"), wa = box.querySelector(".wa"), ok = box.querySelector(".cpok");
    var set = function () { wa.href = "https://wa.me/?text=" + encodeURIComponent(ta.value); };
    set(); ta.addEventListener("input", set);
    box.querySelector(".cp").addEventListener("click", function () {
      var done = function (v) { ok.textContent = v ? "Copiado!" : "Selecione e copie manualmente."; setTimeout(function () { ok.textContent = ""; }, 2500); };
      if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(function () { done(true); }, function () { ta.select(); done(document.execCommand("copy")); });
      else { ta.select(); done(document.execCommand("copy")); }
    });
  });
})();
</script>
</body></html>
